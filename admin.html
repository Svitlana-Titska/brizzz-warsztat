<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel administratora | BRIZZZ_WARSZTAT</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main>
      <h1>BRIZZZ_WARSZTAT</h1>
      <p>Panel odpowiedzi na opinie</p>

      <section id="loginPanel">
        <h2>Logowanie właściciela</h2>
        <form id="loginForm">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required />

          <label for="password">Hasło</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">Zaloguj się</button>
        </form>
      </section>

      <section id="adminPanel" class="hidden">
        <p>Zalogowano jako <strong id="ownerEmail"></strong></p>
        <button id="logoutButton" class="secondary">Wyloguj się</button>
        <p id="status" class="status" role="status"></p>
        <h2>Nowe opinie do zatwierdzenia</h2>
        <div id="pendingReviews"></div>

        <h2>Opublikowane opinie klientów</h2>
        <div id="approvedReviews"></div>

        <h2>Odpowiedzi warsztatu</h2>
        <div id="reviews"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (() => {
        const SUPABASE_URL = "https://qslbtlvoqanwhqlhafwt.supabase.co";

        // Używamy wyłącznie klucza publishable, nigdy service_role.
        const SUPABASE_KEY = "sb_publishable_kHTjSnqwOsXgw9UCGthOKw_jRjYOGYW";

        const OWNER_ID = "edcd7e83-ae8a-4df2-b6a3-9e647e46cfeb";

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginPanel = document.getElementById("loginPanel");
        const adminPanel = document.getElementById("adminPanel");
        const loginForm = document.getElementById("loginForm");
        const status = document.getElementById("status");
        const reviews = document.getElementById("reviews");

        const reviewList = [
          {
            id: "jacek-review",
            name: "Jacek",
            text: "Dziękuję za jakość obsługi i szybką naprawę. 👍",
          },
          {
            id: "yevhenii-review",
            name: "Yevhenii",
            text: "Polecam ten warsztat! Mechanik szybko zdiagnozował problem i sprawnie go naprawił. Profesjonalna obsługa, szybka realizacja i wszystko bez zbędnego czekania. Jestem bardzo zadowolony z usługi!",
          },
        ];

        function showStatus(message) {
          status.textContent = message;
        }

        function makeElement(tag, className, text) {
          const element = document.createElement(tag);
          if (className) element.className = className;
          if (text !== undefined) element.textContent = text;
          return element;
        }

        async function refreshSession() {
          const { data, error } = await client.auth.getSession();

          if (error) {
            showStatus("Nie udało się sprawdzić sesji.");
            return;
          }

          const user = data.session?.user;

          if (!user) {
            loginPanel.classList.remove("hidden");
            adminPanel.classList.add("hidden");
            return;
          }

          if (user.id !== OWNER_ID) {
            await client.auth.signOut();
            loginPanel.classList.remove("hidden");
            adminPanel.classList.add("hidden");
            alert("To konto nie ma uprawnień właściciela.");
            return;
          }

          loginPanel.classList.add("hidden");
          adminPanel.classList.remove("hidden");
          document.getElementById("ownerEmail").textContent = user.email || "";

          await loadPendingReviews();
          await loadApprovedReviews();
          await loadReviews();
        }

        loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();

          const button = loginForm.querySelector("button");
          button.disabled = true;
          showStatus("Logowanie…");

          const { error } = await client.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          });

          button.disabled = false;

          if (error) {
            showStatus("Logowanie nie powiodło się. Sprawdź e-mail i hasło.");
            console.error("Login error:", error.message);
            return;
          }

          loginForm.reset();
          await refreshSession();
        });

        document
          .getElementById("logoutButton")
          .addEventListener("click", async () => {
            await client.auth.signOut();
            reviews.replaceChildren();
            showStatus("");
            await refreshSession();
          });

        let reviewsLoading = false;

        const pendingReviews = document.getElementById("pendingReviews");
        let pendingReviewsLoading = false;

        async function loadPendingReviews() {
          if (!pendingReviews || pendingReviewsLoading) return;

          pendingReviewsLoading = true;
          pendingReviews.replaceChildren();

          try {
            const { data, error } = await client
              .from("customer_reviews")
              .select(
                "id, name, service, rating, review_text, status, created_at",
              )
              .eq("status", "pending")
              .order("created_at", { ascending: false });

            if (error) {
              console.error("Błąd pobierania nowych opinii:", error.message);
              pendingReviews.textContent =
                "Nie udało się pobrać nowych opinii.";
              return;
            }

            if (!data || data.length === 0) {
              pendingReviews.textContent =
                "Brak nowych opinii do zatwierdzenia.";
              return;
            }

            for (const item of data) {
              const card = document.createElement("div");
              card.style.cssText =
                "padding:16px;margin:12px 0;border:1px solid #444;border-radius:10px;";

              const heading = document.createElement("h3");
              heading.textContent = `${item.name} — ${"★".repeat(item.rating)}`;

              const service = document.createElement("p");
              service.textContent = `Usługa: ${item.service}`;

              const message = document.createElement("p");
              message.textContent = item.review_text;
              message.style.whiteSpace = "pre-wrap";

              card.append(heading, service, message);

              const approve = document.createElement("button");
              approve.type = "button";
              approve.textContent = "Zatwierdź";

              approve.addEventListener("click", async () => {
                if (!confirm("Opublikować tę opinię na stronie?")) return;

                approve.disabled = true;

                const { error } = await client
                  .from("customer_reviews")
                  .update({ status: "approved" })
                  .eq("id", item.id);

                if (error) {
                  console.error(error);
                  showStatus("Nie udało się zatwierdzić opinii.");
                  approve.disabled = false;
                  return;
                }

                showStatus("Opinia została opublikowana.");
                await loadPendingReviews();
                await loadApprovedReviews();
                await loadReviews();
              });

              const reject = document.createElement("button");
              reject.type = "button";
              reject.textContent = "Odrzuć";
              reject.className = "secondary";

              reject.addEventListener("click", async () => {
                if (!confirm("Odrzucić opinię? Pozostanie ukryta na stronie."))
                  return;

                reject.disabled = true;

                const { error } = await client
                  .from("customer_reviews")
                  .update({ status: "rejected" })
                  .eq("id", item.id);

                if (error) {
                  console.error(error);
                  showStatus("Nie udało się odrzucić opinii.");
                  reject.disabled = false;
                  return;
                }

                showStatus("Opinia została odrzucona.");
                await loadPendingReviews();
              });

              const remove = document.createElement("button");
              remove.type = "button";
              remove.textContent = "Usuń";
              remove.className = "secondary";

              remove.addEventListener("click", async () => {
                if (!confirm("Czy na pewno usunąć tę opinię na stałe?")) return;

                remove.disabled = true;

                const { error } = await client
                  .from("customer_reviews")
                  .delete()
                  .eq("id", item.id);

                if (error) {
                  console.error(error);
                  showStatus("Nie udało się usunąć opinii.");
                  remove.disabled = false;
                  return;
                }

                showStatus("Opinia została usunięta.");
                await loadPendingReviews();
              });

              card.append(approve, reject, remove);
              pendingReviews.appendChild(card);
            }
          } finally {
            pendingReviewsLoading = false;
          }
        }

        const approvedReviews = document.getElementById("approvedReviews");

        async function loadApprovedReviews() {
          if (!approvedReviews) return;

          approvedReviews.replaceChildren();

          const { data, error } = await client
            .from("customer_reviews")
            .select("id, name, service, rating, review_text, created_at")
            .eq("status", "approved")
            .order("created_at", { ascending: false });

          if (error) {
            console.error(
              "Błąd pobierania opublikowanych opinii:",
              error.message,
            );
            approvedReviews.textContent =
              "Nie udało się pobrać opublikowanych opinii.";
            return;
          }

          if (!data || data.length === 0) {
            approvedReviews.textContent =
              "Brak opublikowanych opinii klientów.";
            return;
          }

          data.forEach((item) => {
            const card = document.createElement("article");
            card.className = "review";

            const heading = document.createElement("h3");
            heading.textContent = `${item.name} — ${"★".repeat(item.rating)}`;

            const service = document.createElement("p");
            service.textContent = `Usługa: ${item.service}`;

            const message = document.createElement("p");
            message.textContent = item.review_text;
            message.style.whiteSpace = "pre-wrap";

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "secondary";
            deleteButton.textContent = "Usuń opinię";

            deleteButton.addEventListener("click", async () => {
              if (
                !confirm(`Czy na pewno usunąć opinię użytkownika ${item.name}?`)
              ) {
                return;
              }

              deleteButton.disabled = true;

              const { error } = await client
                .from("customer_reviews")
                .delete()
                .eq("id", item.id);

              if (error) {
                console.error("Błąd usuwania opinii:", error.message);
                showStatus("Nie udało się usunąć opinii.");
                deleteButton.disabled = false;
                return;
              }

              showStatus("Opinia została usunięta.");
              await loadApprovedReviews();
            });

            card.append(heading, service, message, deleteButton);
            approvedReviews.appendChild(card);
          });
        }

        async function loadReviews() {
          if (reviewsLoading) return;
          reviewsLoading = true;

          reviews.replaceChildren();
          showStatus("Ładowanie opinii…");

          const { data: replies, error } = await client
            .from("review_replies")
            .select("review_id, reply, updated_at");

          if (error) {
            showStatus(
              "Nie udało się pobrać odpowiedzi. Sprawdź ustawienia Data API.",
            );
            console.error("Load replies error:", error.message);
            reviewsLoading = false;
            return;
          }

          const { data: approvedCustomerReviews, error: approvedError } = await client
            .from("customer_reviews")
            .select("id, name, service, rating, review_text")
            .eq("status", "approved")
            .order("created_at", { ascending: false });

          if (approvedError) {
            showStatus("Nie udało się pobrać opinii do odpowiedzi.");
            console.error("Load approved customer reviews error:", approvedError.message);
            reviewsLoading = false;
            return;
          }

          const dynamicReviewList = (approvedCustomerReviews || []).map((item) => ({
            id: String(item.id),
            name: item.name,
            text: item.review_text,
          }));

          const allReviews = [...reviewList, ...dynamicReviewList];

          for (const review of allReviews) {
            const current = replies.find(
              (item) => String(item.review_id) === String(review.id),
            );
            const card = makeElement("article", "review");
            card.append(
              makeElement("h2", "", review.name),
              makeElement("p", "", review.text),
            );

            if (current?.reply) {
              const publishedReply = makeElement("div", "published-reply");

              publishedReply.style.marginTop = "12px";
              publishedReply.style.marginBottom = "16px";
              publishedReply.style.padding = "7px 12px 4px";
              publishedReply.style.background = "#252628";
              publishedReply.style.borderRadius = "8px";

              const replyTitle = makeElement(
                "strong",
                "",
                "Opublikowana odpowiedź warsztatu",
              );

              const replyText = makeElement("p", "", current.reply);
              replyText.style.margin = "8px 0 4px";

              publishedReply.append(replyTitle, replyText);

              card.appendChild(publishedReply);
            }

            const label = makeElement("label", "", "Odpowiedź warsztatu");
            const textarea = document.createElement("textarea");
            textarea.value = "";
            textarea.maxLength = 3000;
            textarea.placeholder = "Napisz odpowiedź po polsku…";
            textarea.setAttribute("aria-label", "Odpowiedź dla " + review.name);

            const saveButton = makeElement(
              "button",
              "",
              current ? "Zapisz zmiany" : "Opublikuj odpowiedź",
            );
            saveButton.type = "button";

            saveButton.addEventListener("click", async () => {
              const reply = textarea.value.trim();

              if (!reply) {
                alert("Wpisz odpowiedź albo użyj przycisku usuwania.");
                return;
              }

              saveButton.disabled = true;
              showStatus("Zapisywanie odpowiedzi…");

              const { data: sessionData } = await client.auth.getSession();
              if (sessionData.session?.user?.id !== OWNER_ID) {
                showStatus("Brak uprawnień właściciela. Zaloguj się ponownie.");
                saveButton.disabled = false;
                return;
              }

              let result;

              if (current) {
                result = await client
                  .from("review_replies")
                  .update({ reply, updated_at: new Date().toISOString() })
                  .eq("review_id", review.id);
              } else {
                result = await client
                  .from("review_replies")
                  .insert({ review_id: review.id, reply });
              }

              saveButton.disabled = false;

              if (result.error) {
                showStatus("Nie udało się zapisać odpowiedzi.");
                console.error("Save reply error:", result.error.message);
                return;
              }

              showStatus("Odpowiedź została zapisana w bazie danych.");

              textarea.value = "";

              await loadReviews();
            });

            label.appendChild(textarea);
            card.append(label, saveButton);

            if (current) {
              const deleteButton = makeElement(
                "button",
                "secondary",
                "Usuń odpowiedź",
              );
              deleteButton.type = "button";

              deleteButton.addEventListener("click", async () => {
                if (!confirm("Czy na pewno usunąć odpowiedź?")) return;

                deleteButton.disabled = true;

                const { error } = await client
                  .from("review_replies")
                  .delete()
                  .eq("review_id", review.id);

                deleteButton.disabled = false;

                if (error) {
                  showStatus("Nie udało się usunąć odpowiedzi.");
                  console.error("Delete reply error:", error.message);
                  return;
                }

                showStatus("Odpowiedź została usunięta.");
                await loadReviews();
              });

              card.appendChild(deleteButton);
            }

            reviews.appendChild(card);
          }

          showStatus("Opinie załadowane.");
          reviewsLoading = false;
        }

        client.auth.onAuthStateChange((event, session) => {
          if (event === "INITIAL_SESSION") return;

          setTimeout(() => {
            refreshSession();
          }, 0);
        });

        refreshSession();
      })();
    </script>
  </body>
</html>
